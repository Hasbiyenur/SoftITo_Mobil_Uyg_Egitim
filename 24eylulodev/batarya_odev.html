<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şarj Süresi Tahmin</title>
</head>
<body>
    <script>
        function tahmin(mevcutYuzde, hedefYuzde, bataryaKwh, istasyonKw, saat) {
            const birimFiyat = 8;
            const sarjEdilecekYuzde = hedefYuzde - mevcutYuzde;
            const gerekenEnerjiKwh = (sarjEdilecekYuzde / 100) * bataryaKwh;
            const sureSaat = gerekenEnerjiKwh / istasyonKw;
            const sureDakika = Math.ceil(sureSaat * 60);

            let toplamUcret = gerekenEnerjiKwh * birimFiyat;

            if (saat >= 22 || saat < 6) {
                toplamUcret = toplamUcret * 2;
            }
            console.log(`Şarj süresi: ${sureDakika} dakika`);
            console.log(`Toplam ücret: ${toplamUcret} TL`);
        }
            console.log(tahmin(10,100,50,100,22))
            console.log(tahmin(10,100,50,100,14))
    </script>
</body>
</html>
